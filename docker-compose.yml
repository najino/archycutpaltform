services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eth
      POSTGRES_PASSWORD: eth
      POSTGRES_DB: edit_team_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eth -d edit_team_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://eth:eth@postgres:5432/edit_team_hub
      BOT_MODE: webhook
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://eth:eth@postgres:5432/edit_team_hub
      BOT_MODE: webhook
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
